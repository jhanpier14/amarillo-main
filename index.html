<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOYIS ❤️</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            min-height: 100%;
            min-height: 100svh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('img/amar.jpg') no-repeat center center/cover;
            font-family: 'Arial', sans-serif;
        }

        body > div {
            width: min(100%, 900px);
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }

        h1, h2 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        h1 {
            font-size: clamp(2.2rem, 8vw, 7rem);
            animation: fadeInOut 3s infinite; /* Animación suave */
        }

        h2 {
            font-size: clamp(1.3rem, 4vw, 3rem);
            margin-top: clamp(12px, 3vh, 24px);
            animation: pulse 2s infinite; /* Pequeño efecto de pulsación */
        }

        button {
            font-size: clamp(1rem, 3vw, 1.5rem);
            min-height: 48px;
            padding: 12px 30px;
            margin-top: 30px;
            border: none;
            background-color: #ffd700;
            color: black;
            cursor: pointer;
            border-radius: 50px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.4);
        }

        @media (max-width: 480px) {
            body > div {
                padding: 18px;
            }

            h1 {
                font-size: clamp(2rem, 10vw, 3rem);
            }

            button {
                max-width: 100%;
                padding-inline: 22px;
            }
        }

        @keyframes fadeInOut {
            0%, 100% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
    </style>
</head>
<body>
    <div>
        <h1>YOYIS (●'◡'●)💕</h1>
        <h2>Tengo un regalito para ti 🎁(◔◡◔)</h2>
        <button onclick="window.location.href='rosas.html'">VE TU REGALITO </button>
    </div>
</body>
</html>
